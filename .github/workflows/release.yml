name: Windows signed updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tul-writer-windows-updates
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # The repository name ends in a dot: the default Windows checkout path is invalid.
      - name: Download exact commit into a Windows-safe source directory
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'tul-writer-source'
          $sourceArchive = Join-Path $env:RUNNER_TEMP 'tul-writer-source.tar.gz'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          gh api "repos/$env:GITHUB_REPOSITORY/tarball/$env:GITHUB_SHA" > $sourceArchive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xzf $sourceArchive --strip-components=1 -C $sourceDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $sourceDir 'package-lock.json'))) { throw 'Source archive is incomplete.' }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: ${{ runner.temp }}/tul-writer-source
      - run: npm test
        working-directory: ${{ runner.temp }}/tul-writer-source
      - run: npm run check
        working-directory: ${{ runner.temp }}/tul-writer-source
      - name: Updater and document safety tests
        working-directory: ${{ runner.temp }}/tul-writer-source
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml updates::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml documents::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml workspace::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unique version for this main build
        working-directory: ${{ runner.temp }}/tul-writer-source
        run: node scripts/version.mjs --ci $env:GITHUB_RUN_NUMBER
      - name: Build signed Windows installers
        working-directory: ${{ runner.temp }}/tul-writer-source
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure updater signing secrets first.' }
          npm run tauri build -- --bundles nsis,msi
      - name: Publish private update after successful checks
        working-directory: ${{ runner.temp }}/tul-writer-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tul-writer-windows
          path: |
            ${{ runner.temp }}/tul-writer-source/src-tauri/target/release/tul-writer.exe
            ${{ runner.temp }}/tul-writer-source/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/tul-writer-source/src-tauri/target/release/bundle/msi/*.msi
            ${{ runner.temp }}/tul-writer-source/src-tauri/target/release/bundle/nsis/*.sig
            ${{ runner.temp }}/tul-writer-source/src-tauri/target/release/bundle/msi/*.sig
            ${{ runner.temp }}/tul-writer-source/output/latest.json
