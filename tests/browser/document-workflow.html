<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/tul-writer.css">
<script type="module">
const source = new DOMParser().parseFromString(await fetch("/index.html").then(r => r.text()), "text/html");
source.querySelectorAll("script").forEach(script => script.remove());
document.body.replaceChildren(...source.body.children);
document.getElementById("welcome").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
const result = document.createElement("pre"); result.id = "workspace-test-result"; result.hidden = true; document.body.append(result);
try {
  const { setRoot, setMainFile, setCurrent, setDirty, assignDirty, renderCrumb } = await import("/src/core.ts");
  const { documentProgress } = await import("/src/document-progress.ts");
  const { workflow, settings } = await import("/tests/browser/workflow-mocks.ts");
  let checks = 0;
  const check = (condition, message) => { if (!condition) throw Error(message); checks++; };
  const status = () => document.getElementById("status-text").textContent;
  const bytesFor = text => {
    const objects = [
      "<< /Type /Catalog /Pages 2 0 R >>", "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 300 200] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
    ];
    const stream = `BT /F1 16 Tf 30 150 Td (${text}) Tj ET`;
    objects.push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    let pdf = "%PDF-1.4\n"; const offsets = [0];
    objects.forEach((object, index) => { offsets.push(pdf.length); pdf += `${index+1} 0 obj\n${object}\nendobj\n`; });
    const xref = pdf.length;
    pdf += `xref\n0 ${objects.length+1}\n0000000000 65535 f \n` + offsets.slice(1).map(offset => `${String(offset).padStart(10,"0")} 00000 n \n`).join("");
    return new TextEncoder().encode(pdf + `trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  };
  let pdfBytes = bytesFor("Project A"), compileHook, chooseHook, readHook, compileOk = true;
  const exports = [], dialogs = [];
  window.__TAURI_INTERNALS__ = { invoke: async (command, args, options) => {
    if (command === "compile") {
      workflow.calls.push("compile");
      if (compileHook) await compileHook();
      return { ok: compileOk, pdf: compileOk ? "build/main.pdf" : null, engine: "pdflatex", log: "" };
    }
    if (command === "read_binary") { if (readHook) await readHook(); return pdfBytes.slice().buffer; }
    if (command === "plugin:dialog|save") { dialogs.push(args); return chooseHook ? chooseHook() : "C:\\Exports\\Prace.pdf"; }
    if (command === "export_pdf") { exports.push({ bytes: [...args], destination: decodeURIComponent(options.headers["x-dest"]) }); return; }
    if (command === "read_file") return "";
    throw Error(`Unexpected IPC: ${command}`);
  } };
  const preview = await import("/src/preview.ts");
  const { compile, saveFile } = await import("/src/build.ts");
  const reset = () => {
    setRoot(null);
    setRoot("C:\\Project A"); setMainFile("main.tex"); setCurrent("main.tex");
    assignDirty(false); renderCrumb(); settings.compileOnSave = false;
    workflow.calls.length = 0; workflow.saveError = ""; workflow.sideError = ""; workflow.onSave = null;
    workflow.onSideSave = null;
    compileHook = null; chooseHook = null; readHook = null; compileOk = true;
    pdfBytes = bytesFor("Project A"); preview.resetPdf();
  };

  reset();
  check(document.querySelector("#pdf .pdf-empty [data-create-pdf]").textContent === "Překompilovat", "Empty preview offers compilation separately from PDF export");
  await compile();
  check(workflow.calls.join("|") === "save|saveSide|compile", "PDF creation saves both editors first");
  check(status() === "Náhled je aktualizovaný", "Compilation confirms preview refresh, not a saved PDF copy");
  check(dialogs.length === 0 && exports.length === 0, "Compilation never opens an export dialog or saves a user-selected PDF copy");
  check(document.querySelectorAll("#pdf canvas").length === 1 && !document.getElementById("pdf-bar").hidden, "Real PDF.js renders the resulting page");
  check(!document.getElementById("pdf-download").disabled && document.getElementById("pdf-download").textContent.includes("Uložit PDF"), "Export is visible and enabled only after a real render");
  check(document.getElementById("pdf-freshness").dataset.state === "current", "A successful build publishes its source revision");
  setDirty(true); setDirty(true);
  check(document.getElementById("source-state").textContent === "Neuložené změny" && document.getElementById("pdf-freshness").dataset.state === "stale", "Typing visibly separates unsaved text from an older PDF");
  const announcements = [];
  const observer = new MutationObserver(records => announcements.push(...records));
  observer.observe(document.getElementById("source-state"), { childList: true, subtree: true, characterData: true });
  observer.observe(document.getElementById("pdf-freshness-text"), { childList: true, subtree: true, characterData: true });
  setDirty(true); await Promise.resolve(); observer.disconnect();
  check(announcements.length === 0, "Continued typing does not repeatedly announce unchanged status text");
  setDirty(false);
  check(document.getElementById("source-state").textContent === "Otevřené změny uloženy" && document.getElementById("pdf-freshness").dataset.state === "stale", "Saving source cannot acknowledge an older PDF");
  documentProgress.changed("chapter.tex"); documentProgress.saved("chapter.tex");
  check(document.getElementById("pdf-freshness").dataset.state === "stale", "Saving another edited file also leaves PDF stale");
  await compile();
  check(document.getElementById("pdf-freshness").dataset.state === "current", "Rebuilding includes the new source revision");
  compileHook = () => setDirty(true); await compile(); compileHook = null;
  check(document.getElementById("pdf-freshness").dataset.state === "stale" && status().includes("mezitím změnil"), "Typing during compilation cannot produce a false ready state");
  setDirty(false); await compile();
  setDirty(true); setDirty(false); compileOk = false; await compile(); compileOk = true;
  check(document.getElementById("pdf-freshness").dataset.state === "stale" && !document.getElementById("pdf-download").disabled, "Failed rebuild keeps the existing PDF visibly stale and exportable");
  await preview.renderPdf("build/other.pdf");
  check(document.getElementById("pdf-freshness").dataset.state === "unknown", "A PDF opened without build provenance is never labelled current");
  await compile();
  const original = [...pdfBytes];
  chooseHook = async () => {
    setRoot("C:\\Project B"); preview.resetPdf(); pdfBytes = bytesFor("Project B");
    await preview.renderPdf("build/B.pdf");
    return "C:\\Exports\\Project A.pdf";
  };
  await preview.downloadPdf();
  check(JSON.stringify(exports.at(-1).bytes) === JSON.stringify(original), "Export keeps A bytes while another project and preview replace it");
  check(dialogs.at(-1).options.defaultPath === "Project A.pdf", "Dialog name belongs to the captured project");
  check(exports.at(-1).destination.endsWith("Project A.pdf"), "Binary export receives the exact chosen destination");

  reset(); workflow.saveError = "FILE_CONFLICT: source changed";
  await compile();
  check(workflow.calls.join("|") === "save" && !preview.lastPdf, "Main save conflict never compiles or displays a new PDF");
  check(status().includes("FILE_CONFLICT"), "Save conflict stays visible to the user");
  check(!document.getElementById("btn-compile").disabled && !document.querySelector("[data-create-pdf]").disabled, "Failed save allows a retry from either action");

  reset(); workflow.sideError = "Side file changed"; await compile();
  check(workflow.calls.join("|") === "save|saveSide" && !preview.lastPdf, "Side save conflict also prevents compilation");

  reset(); workflow.onSave = () => setRoot("C:\\Other project"); await compile();
  check(workflow.calls.join("|") === "save", "Switching projects during save never saves a different side editor");

  reset(); compileHook = () => setRoot("C:\\Other project"); await compile();
  check(!preview.lastPdf && document.querySelectorAll("#pdf canvas").length === 0, "A completed old project build never replaces another project's preview");

  reset(); readHook = () => setMainFile("other.tex"); await compile();
  check(!preview.lastPdf && document.querySelectorAll("#pdf canvas").length === 0, "Changing the main document during PDF loading cannot publish the old result");

  reset(); compileOk = false; await compile();
  check(!preview.lastPdf && status().includes("Kompilace se nezdařila"), "Failed compilation is not reported as a ready PDF");

  reset(); pdfBytes = new Uint8Array([1,2,3]); await compile();
  check(!preview.lastPdf && document.getElementById("pdf-download").disabled, "An invalid PDF never becomes an exportable preview");

  reset(); await compile(); setDirty(true); setDirty(false);
  let resumeFailed;
  compileOk = false; compileHook = () => new Promise(resolve => { resumeFailed = resolve; });
  const failedPending = compile();
  for (let i=0; !resumeFailed && i<100; i++) await new Promise(resolve => setTimeout(resolve,10));
  preview.rerenderPdfSoon(); await new Promise(resolve => setTimeout(resolve,250));
  check(document.getElementById("pdf").classList.contains("rescaling"), "Resize waits while compilation owns the preview");
  resumeFailed(); await failedPending;
  for (let i=0; document.getElementById("pdf").classList.contains("rescaling") && i<300; i++) await new Promise(resolve => setTimeout(resolve,10));
  check(!document.getElementById("pdf").classList.contains("rescaling") && document.getElementById("pdf-freshness").dataset.state === "stale", "Resize resumes after a failed build without acknowledging stale PDF");

  reset(); let release;
  compileHook = () => new Promise(resolve => { release = resolve; });
  const pending = compile();
  for (let i=0; !release && i<100; i++) await new Promise(resolve => setTimeout(resolve,10));
  await compile();
  check(workflow.calls.filter(call => call === "compile").length === 1, "Repeated clicks create only one build");
  check(document.getElementById("btn-compile").disabled && document.getElementById("pdf-download").disabled, "Build and export controls reflect the pending operation");
  release(); await pending;
  check(!document.getElementById("btn-compile").disabled && !document.getElementById("pdf-download").disabled, "Controls recover after successful rendering");
  preview.resetPdf();
  check(!!document.querySelector("[data-create-pdf]") && document.getElementById("pdf-download").disabled, "Reset restores the contextual PDF action without a stale export");
  check(document.getElementById("pdf-freshness").hidden, "Reset removes the previous PDF provenance message");

  reset(); await compile(); workflow.calls.length = 0;
  setDirty(true); documentProgress.changed("chapter.tex");
  workflow.onSave = () => setDirty(false);
  workflow.onSideSave = () => documentProgress.saved("chapter.tex");
  await saveFile();
  check(workflow.calls.join("|") === "save|saveSide" && status() === "Otevřené změny jsou uložené", "Ordinary Save writes both editors and confirms completion without compiling");
  check(documentProgress.unsaved.size === 0 && documentProgress.pdfState === "stale", "Saving both sources leaves the older preview stale");
  check(!document.getElementById("btn-save").disabled && document.getElementById("btn-save").textContent.includes("Uložit"), "Visible Save allows the next operation");

  reset(); settings.compileOnSave = true; setDirty(true); workflow.saveError = "FILE_CONFLICT: main.tex";
  await saveFile();
  check(workflow.calls.join("|") === "save" && status().includes("nebylo dokončeno") && documentProgress.unsaved.has("main.tex"), "Main save error preserves pending text and prevents automatic compilation");

  reset(); settings.compileOnSave = true; setDirty(true); documentProgress.changed("chapter.tex");
  workflow.onSave = () => setDirty(false); workflow.sideError = "FILE_CONFLICT: chapter.tex";
  await saveFile();
  check(workflow.calls.join("|") === "save|saveSide" && documentProgress.unsaved.has("chapter.tex") && !documentProgress.unsaved.has("main.tex"), "Partial save reports failure without acknowledging the conflicted side source");

  reset(); let finishSave;
  workflow.onSave = () => new Promise(resolve => { finishSave = resolve; });
  const pendingSave = saveFile(); await saveFile();
  check(workflow.calls.join("|") === "save" && document.getElementById("btn-save").disabled, "Repeated Save does not enqueue a second operation");
  finishSave(); await pendingSave;
  check(workflow.calls.join("|") === "save|saveSide" && !document.getElementById("btn-save").disabled, "Save lock releases after completion");

  reset(); workflow.onSave = () => setRoot("C:\\Other project"); await saveFile();
  check(workflow.calls.join("|") === "save", "Save command never crosses into a different project's side buffer");

  reset(); settings.compileOnSave = true;
  workflow.onSideSave = () => setDirty(true); await saveFile();
  check(workflow.calls.join("|") === "save|saveSide" && status().includes("další úpravy"), "Typing into a saved main buffer during side save is not acknowledged or compiled");

  reset(); setCurrent("figure.pdf"); documentProgress.changed("chapter.tex");
  workflow.onSideSave = () => documentProgress.saved("chapter.tex"); await saveFile();
  check(workflow.calls.join("|") === "save|saveSide" && !documentProgress.unsaved.size, "Save remains available to side text when the main pane shows a preview");

  reset(); settings.compileOnSave = true; await saveFile();
  check(workflow.calls.join("|") === "save|saveSide|save|saveSide|compile", "Enabled compile-on-save runs only after both source saves succeed");

  document.getElementById("menubar").textContent = "Soubor Edit Insert View Kompilace Review Notes Nápověda";
  document.getElementById("menubar").style.whiteSpace = "nowrap";
  document.getElementById("app").style.width = "820px";
  check(["btn-save", "btn-compile", "btn-settings"].every(id => document.getElementById(id).getBoundingClientRect().right <= 821), "Primary workflow controls remain inside the minimum desktop width");

  const { startTour, closeTour, tourOnFirstProject } = await import("/src/tour.ts");
  const beforeTour = document.getElementById("btn-save"); beforeTour.focus(); startTour();
  check(document.getElementById("tour-title").textContent.includes("Uložte") && document.querySelector(".tour-count").textContent === "1 ze 4", "First-run guidance begins with the ordinary save workflow in Czech");
  const nextTour = () => document.querySelector(".tour-card .btn-primary").click();
  nextTour(); check(document.getElementById("tour-title").textContent === "Obnovte náhled", "Tour distinguishes compilation from saving source");
  nextTour(); check(document.getElementById("tour-title").textContent === "Uložte výsledné PDF", "Tour gives PDF export its own step");
  const scratch = document.createElement("input"); document.body.append(scratch); scratch.focus();
  scratch.dispatchEvent(new KeyboardEvent("keydown", { key:"ArrowRight", bubbles:true, cancelable:true }));
  check(document.getElementById("tour-title").textContent === "Uložte výsledné PDF", "Nonmodal tour does not steal editing arrow keys");
  scratch.remove(); nextTour(); startTour();
  check(document.querySelectorAll(".tour-card").length === 1 && document.getElementById("tour-title").textContent.includes("Orientujte"), "Starting an active tour cannot duplicate or reset it");
  nextTour(); check(!document.querySelector(".tour-card") && document.activeElement === beforeTour, "Finishing returns focus to the workflow and removes guidance");
  localStorage.removeItem("scribe.tour"); tourOnFirstProject(); setRoot(null);
  await new Promise(resolve => setTimeout(resolve,750));
  check(!document.querySelector(".tour-card"), "Delayed first-run guidance never appears after leaving the project");
  reset(); tourOnFirstProject(); closeTour(); await new Promise(resolve => setTimeout(resolve,750));
  check(!document.querySelector(".tour-card"), "Closing guidance also cancels a queued automatic start");
  await compile();
  result.textContent = JSON.stringify({ ok: true, checks });
} catch (error) { result.textContent = JSON.stringify({ ok:false, error:String(error.stack||error) }); }
</script>
